# CI for CAP-33 Event Dedup & Replay.
# Every push / pull request: unit + integration tests for each part, then the whole system
# is started with Docker Compose and the evaluator scenarios run against it
# (shuffled arrival order + repeated messages, several seeds).
# No cloud credentials are used: S3 and Snowflake stay off in CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-tests:
    name: Java service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: consumer-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: consumer-service/pom.xml
      # Testcontainers starts MySQL and an S3 mock in Docker (available on the runner)
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: consumer-service/target/surefire-reports/

  simulator-tests:
    name: Python simulator tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: simulator/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  dashboard-tests:
    name: Dashboard tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  end-to-end:
    name: End-to-end (Docker Compose + evaluator scenarios)
    needs: [service-tests, simulator-tests, dashboard-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Throwaway settings for CI only - real credentials never go into the repository
      - name: Create CI .env
        run: |
          cat > .env <<'ENV'
          MYSQL_ROOT_PASSWORD=ci_root_pw
          MYSQL_DATABASE=event_db
          MYSQL_USER=app_user
          MYSQL_PASSWORD=ci_app_pw
          MYSQL_PORT=3307
          S3_ENABLED=false
          SNOWFLAKE_ENABLED=false
          ENV
          mkdir -p keys

      - name: Build images and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: simulator/requirements.txt
      - run: pip install -r simulator/requirements.txt

      # All calls go through nginx (dashboard container) -> consumer service -> MySQL
      - name: Scenarios with different random seeds
        working-directory: simulator
        env:
          EDR_API_URL: http://localhost:3000/api
        run: |
          for seed in 1 7 42; do
            echo "::group::simulate.py run --seed $seed"
            python simulate.py run --seed "$seed" --quiet
            echo "::endgroup::"
          done

      - name: Evaluator test - shuffled arrival order and repeated messages
        working-directory: simulator
        env:
          EDR_API_URL: http://localhost:3000/api
        run: |
          for seed in 3 11 29; do
            echo "::group::four_orders.json --shuffle --seed $seed"
            python simulate.py send samples/four_orders.json --shuffle --seed "$seed" \
              --repeat E701-1 --repeat E704-3 --check --quiet
            echo "::endgroup::"
          done

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color consumer-service dashboard

      - name: Stop the stack
        if: always()
        run: docker compose down -v
