spring.application.name=consumer-service
server.port=${SERVER_PORT:8080}

# Load DB credentials from the project-root .env file (one level up).
# Optional: in Docker the same values come from real environment variables.
spring.config.import=optional:file:../.env[.properties]

# ---------- MySQL (Docker container on port 3307) ----------
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:event_db}
spring.datasource.username=${MYSQL_USER:app_user}
spring.datasource.password=${MYSQL_PASSWORD}

# ---------- JPA ----------
# Schema is owned by db/init/*.sql - Hibernate must never change it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Ingest ----------
ingest.max-batch-size=1000

# ---------- Consumer pipeline ----------
# Poll the inbox every 500 ms (single thread, arrival order)
consumer.scheduler.enabled=true
consumer.poll-interval-ms=500
consumer.initial-delay-ms=2000
# Unexpected failures are retried; after this many attempts -> dead letter (PROCESSING_ERROR)
consumer.max-attempts=3
# Demo only: crash once after the side effect for these event ids, e.g. E102 (empty = off)
consumer.fault-injection.fail-once-event-ids=

# ---------- Amazon S3 raw event log ----------
# Values come from the project .env file. S3 is off unless S3_ENABLED=true.
s3.enabled=${S3_ENABLED:false}
s3.bucket=${S3_BUCKET:}
s3.region=${AWS_REGION:ap-south-1}
s3.prefix=${S3_PREFIX:}
# Only for S3-compatible test storage; leave empty for real AWS
s3.endpoint=${S3_ENDPOINT:}
s3.access-key-id=${AWS_ACCESS_KEY_ID:}
s3.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
# The archiver uploads pending messages every second
s3.archive-interval-ms=1000

# Consumer and S3 archiver run on separate scheduler threads
spring.task.scheduling.pool.size=2

# ---------- Snowflake (independent reconciliation + analytics) ----------
# Values come from the project .env file. Off unless SNOWFLAKE_ENABLED=true.
# Login uses an RSA key pair (no password) for the service user.
snowflake.enabled=${SNOWFLAKE_ENABLED:false}
snowflake.account=${SNOWFLAKE_ACCOUNT:}
snowflake.user=${SNOWFLAKE_USER:EDR_APP}
snowflake.private-key-file=${SNOWFLAKE_PRIVATE_KEY_FILE:}
snowflake.warehouse=${SNOWFLAKE_WAREHOUSE:EDR_WH}
snowflake.database=${SNOWFLAKE_DATABASE:EDR_DB}
snowflake.schema=${SNOWFLAKE_SCHEMA:ANALYTICS}
snowflake.role=${SNOWFLAKE_ROLE:EDR_APP_ROLE}

# ---------- Admin (development / demo only) ----------
# Enables POST /admin/reset and POST /admin/faults/fail-once used by the simulator.
# Set to false anywhere real data matters.
admin.enabled=true

# ---------- Dashboard ----------
# Browser origins allowed to call the API directly (comma-separated). The Vite dev proxy and
# nginx serve the dashboard from the same origin as the API, so this is only a fallback.
dashboard.allowed-origins=${DASHBOARD_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---------- Errors ----------
# Include the reason (e.g. why a replay was refused) in error responses
spring.web.error.include-message=always

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
