spring.application.name=consumer-service
server.port=${SERVER_PORT:8080}

# Load DB credentials from the project-root .env file (one level up).
# Optional: in Docker the same values come from real environment variables.
spring.config.import=optional:file:../.env[.properties]

# ---------- MySQL (Docker container on port 3307) ----------
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:event_db}
spring.datasource.username=${MYSQL_USER:app_user}
spring.datasource.password=${MYSQL_PASSWORD}

# ---------- JPA ----------
# Schema is owned by db/init/*.sql - Hibernate must never change it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Ingest ----------
ingest.max-batch-size=1000

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
