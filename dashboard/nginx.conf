# The dashboard calls the API as /api/...; nginx forwards it to the consumer service.
# Browser and API share one origin, so no CORS is needed (same idea as the Vite dev proxy).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        # Trailing slash strips the /api prefix: /api/metrics -> /metrics
        proxy_pass http://consumer-service:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Drop the browser's Origin header, otherwise the service checks it against its CORS list
        proxy_set_header Origin "";
        # Replay and reconciliation can take a while
        proxy_read_timeout 120s;
    }

    # Hashed build files can be cached for a long time; index.html never
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
